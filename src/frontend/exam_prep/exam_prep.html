<div class="exam-page">

    <div class="page-header">

        <h1>
            📝 Exam Preparation
        </h1>

        <p>
            Generate exam ready material instantly
        </p>

    </div>

    <div class="exam-grid">

        <div
            class="exam-card"
            id="mock-card"
        >

            <div class="icon">
                📋
            </div>

            <h2>
                Mock Test
            </h2>

            <p>
                Full length exam simulation
            </p>

        </div>

        <div
            class="exam-card"
            id="revision-card"
        >

            <div class="icon">
                ⚡
            </div>

            <h2>
                Revision Sheet
            </h2>

            <p>
                Last minute revision notes
            </p>

        </div>

    </div>

    <div class="difficulty-panel">

        <h2>
            Difficulty Selection
        </h2>

        <div class="difficulty-grid">

            <button>
                Easy
            </button>

            <button>
                Medium
            </button>

            <button>
                Hard
            </button>

        </div>

    </div>

    <div class="stats-panel">

        <div class="stat-card">

            <h2>
                {{DOCS}}
            </h2>

            <span>
                Documents Available
            </span>

        </div>

        <div class="stat-card">

            <h2>
                {{CHUNKS}}
            </h2>

            <span>
                Knowledge Chunks
            </span>

        </div>

    </div>

</div>
